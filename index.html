<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2eb">
  <title>Northstar Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f2eb;
      --panel: #fbfaf5;
      --ink: #202923;
      --muted: #778078;
      --line: #dcded4;
      --green: #1d5c47;
      --green-deep: #164936;
      --green-pale: #e4ede6;
      --gold: #d5a247;
      --red: #b64d3b;
      --shadow: 0 16px 50px rgba(28, 44, 34, .10), 0 2px 8px rgba(28, 44, 34, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--paper);
      background-image: radial-gradient(#c9cfc2 0.65px, transparent 0.65px);
      background-size: 19px 19px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 28px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 39px; height: 39px; display: grid; place-items: center; border-radius: 11px; background: var(--green); color: white; box-shadow: 0 4px 10px #1d5c4733; }
    .mark svg { width: 23px; height: 23px; }
    .brand-name { margin: 0; font: 700 17px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .2px; }
    .brand-sub { margin: 4px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; }
    .offline { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .offline-dot { width: 7px; height: 7px; border-radius: 50%; background: #4d936a; box-shadow: 0 0 0 3px #4d936a20; }
    main { display: grid; grid-template-columns: minmax(0, 650px) minmax(230px, 1fr); gap: 20px; align-items: start; }
    .calculator, .history-panel { border: 1px solid #e2e3da; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    .calculator { overflow: hidden; }
    .display { min-height: 190px; padding: 24px 27px 19px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #fafaf4 0%, #f0f3eb 100%); display: flex; flex-direction: column; }
    .display-top { display: flex; align-items: center; justify-content: space-between; }
    .display-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
    .angle-toggle { padding: 6px 10px; border: 1px solid #cdd6cc; border-radius: 6px; color: var(--green); background: #fffefa; font-size: 11px; font-weight: 700; cursor: pointer; }
    .angle-toggle:hover { border-color: var(--green); }
    .expression { min-height: 40px; margin-top: auto; overflow: hidden; color: #707970; font: 16px/1.5 "Consolas", "Courier New", monospace; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .result { min-height: 54px; overflow: hidden; color: var(--ink); font: 400 clamp(30px, 5vw, 42px)/1.25 Georgia, "Times New Roman", serif; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .result.error { color: var(--red); font: 16px/2.8 "Trebuchet MS", "Segoe UI", sans-serif; }
    .memory-row { min-height: 38px; display: flex; align-items: center; gap: 7px; padding: 8px 16px; border-bottom: 1px solid #e9eae3; }
    .memory-label { margin-right: 2px; color: #929990; font-size: 10px; font-weight: 700; letter-spacing: .8px; }
    .memory-button { padding: 4px 7px; border: 0; border-radius: 4px; background: transparent; color: #68746a; font-size: 10px; font-weight: 700; cursor: pointer; }
    .memory-button:hover { background: var(--green-pale); color: var(--green); }
    .memory-indicator { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: transparent; }
    .memory-indicator.active { background: var(--gold); }
    .keypad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; padding: 15px 16px 17px; }
    .key { min-width: 0; height: 53px; border: 1px solid #e5e6df; border-radius: 7px; background: #fffefa; color: var(--ink); font-size: 16px; cursor: pointer; transition: transform .12s ease, background .12s ease, border-color .12s ease; }
    .key:hover { transform: translateY(-1px); border-color: #bac9bc; background: #f5f8f2; }
    .key:active { transform: translateY(0); }
    .key.function { color: var(--green); background: #f1f5ef; font-size: 13px; font-weight: 700; }
    .key.operator { color: var(--green); background: #edf2eb; font-size: 20px; }
    .key.danger { color: var(--red); background: #fbf2ef; font-size: 13px; font-weight: 700; }
    .key.equals { border-color: var(--green); background: var(--green); color: white; font-size: 21px; }
    .key.equals:hover { border-color: var(--green-deep); background: var(--green-deep); }
    .key.zero { grid-column: span 2; }
    .history-panel { min-height: 548px; display: flex; flex-direction: column; }
    .history-heading { display: flex; align-items: center; justify-content: space-between; padding: 20px 18px 15px; border-bottom: 1px solid var(--line); }
    .history-title { margin: 0; font: 700 16px Georgia, "Times New Roman", serif; }
    .clear-history { padding: 5px; border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; }
    .clear-history:hover { color: var(--red); }
    .history-list { flex: 1; overflow-y: auto; padding: 5px 10px; }
    .history-item { width: 100%; padding: 12px 9px; border: 0; border-bottom: 1px solid #edeee7; background: transparent; text-align: right; cursor: pointer; }
    .history-item:hover { background: #f2f5ee; }
    .history-expression { display: block; overflow: hidden; color: var(--muted); font: 11px/1.5 "Consolas", "Courier New", monospace; text-overflow: ellipsis; white-space: nowrap; }
    .history-result { display: block; margin-top: 2px; color: var(--ink); font: 18px Georgia, "Times New Roman", serif; }
    .empty-history { padding: 28px 12px; color: #8b938a; font-size: 12px; line-height: 1.6; text-align: center; }
    .footer { margin-top: 16px; color: #818980; font-size: 11px; text-align: center; }
    kbd { padding: 2px 5px; border: 1px solid #d5d9d0; border-radius: 4px; background: #fafaf5; color: #657168; font: 10px "Consolas", monospace; }
    @media (max-width: 760px) {
      .shell { width: min(560px, calc(100% - 24px)); padding-top: 20px; }
      main { grid-template-columns: 1fr; gap: 14px; }
      .history-panel { min-height: auto; max-height: 270px; }
      .history-list { min-height: 74px; }
      .display { min-height: 164px; padding: 19px 19px 14px; }
      .keypad { gap: 7px; padding: 12px; }
      .key { height: 49px; }
    }
    @media (max-width: 380px) {
      .shell { width: calc(100% - 16px); }
      .keypad { gap: 5px; padding: 9px; }
      .key { height: 45px; font-size: 14px; }
      .key.function { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.2 9.8 21.2 12l-7 2.2-2.2 7-2.2-7-7-2.2 7-2.2L12 2.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
        </div>
        <div><p class="brand-name">Northstar</p><p class="brand-sub">Everyday + scientific</p></div>
      </div>
      <div class="offline"><span class="offline-dot"></span> Works offline</div>
    </header>
    <main>
      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite">
          <div class="display-top"><span class="display-label">Calculation</span><button id="angleToggle" class="angle-toggle" type="button" title="Switch angle units">DEG</button></div>
          <div id="expression" class="expression">Ready when you are</div>
          <div id="result" class="result">0</div>
        </div>
        <div class="memory-row" aria-label="Memory controls">
          <span class="memory-label">MEMORY</span>
          <button class="memory-button" data-action="mc" type="button" title="Clear memory">MC</button>
          <button class="memory-button" data-action="mr" type="button" title="Recall memory">MR</button>
          <button class="memory-button" data-action="mplus" type="button" title="Add displayed value to memory">M+</button>
          <button class="memory-button" data-action="mminus" type="button" title="Subtract displayed value from memory">M-</button>
          <span id="memoryIndicator" class="memory-indicator" aria-label="Memory empty"></span>
        </div>
        <div class="keypad" id="keypad">
          <button class="key function" data-insert="sin(" type="button">sin</button>
          <button class="key function" data-insert="cos(" type="button">cos</button>
          <button class="key function" data-insert="tan(" type="button">tan</button>
          <button class="key function" data-insert="sqrt(" type="button">√</button>
          <button class="key danger" data-action="clear" type="button">AC</button>

          <button class="key function" data-insert="asin(" type="button">sin⁻¹</button>
          <button class="key function" data-insert="acos(" type="button">cos⁻¹</button>
          <button class="key function" data-insert="atan(" type="button">tan⁻¹</button>
          <button class="key function" data-insert="^2" type="button">x²</button>
          <button class="key danger" data-action="delete" type="button">DEL</button>

          <button class="key function" data-insert="log(" type="button">log</button>
          <button class="key function" data-insert="ln(" type="button">ln</button>
          <button class="key function" data-insert="π" type="button">π</button>
          <button class="key function" data-insert="^" type="button">xʸ</button>
          <button class="key function" data-insert="!" type="button">n!</button>

          <button class="key function" data-insert="(" type="button">(</button>
          <button class="key function" data-insert=")" type="button">)</button>
          <button class="key function" data-insert="%" type="button">%</button>
          <button class="key operator" data-insert="÷" type="button">÷</button>
          <button class="key operator" data-insert="×" type="button">×</button>

          <button class="key" data-insert="7" type="button">7</button>
          <button class="key" data-insert="8" type="button">8</button>
          <button class="key" data-insert="9" type="button">9</button>
          <button class="key operator" data-insert="-" type="button">−</button>
          <button class="key operator" data-insert="+" type="button">+</button>

          <button class="key" data-insert="4" type="button">4</button>
          <button class="key" data-insert="5" type="button">5</button>
          <button class="key" data-insert="6" type="button">6</button>
          <button class="key function" data-insert="e" type="button">e</button>
          <button class="key function" data-insert="Ans" type="button">Ans</button>

          <button class="key" data-insert="1" type="button">1</button>
          <button class="key" data-insert="2" type="button">2</button>
          <button class="key" data-insert="3" type="button">3</button>
          <button class="key function" data-insert="abs(" type="button">abs</button>
          <button class="key equals" data-action="equals" type="button">=</button>

          <button class="key zero" data-insert="0" type="button">0</button>
          <button class="key" data-insert="." type="button">.</button>
          <button class="key function" data-action="sign" type="button">±</button>
          <button class="key function" data-insert="^3" type="button">x³</button>
        </div>
      </section>
      <aside class="history-panel" aria-label="Calculation history">
        <div class="history-heading"><h2 class="history-title">History</h2><button id="clearHistory" class="clear-history" type="button">Clear</button></div>
        <div id="historyList" class="history-list"></div>
      </aside>
    </main>
    <footer class="footer">Keyboard ready: <kbd>Enter</kbd> calculate &nbsp; <kbd>Esc</kbd> clear &nbsp; <kbd>Backspace</kbd> delete</footer>
  </div>
  <script>
    (() => {
      const expressionView = document.getElementById('expression');
      const resultView = document.getElementById('result');
      const historyView = document.getElementById('historyList');
      const memoryIndicator = document.getElementById('memoryIndicator');
      const angleToggle = document.getElementById('angleToggle');
      const historyKey = 'northstar-calculator-history';
      let expression = '';
      let answer = 0;
      let memory = null;
      let degrees = true;
      let justCalculated = false;
      let history = loadHistory();

      function loadHistory() {
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          return Array.isArray(saved) ? saved.slice(0, 30) : [];
        } catch { return []; }
      }

      function format(value) {
        if (!Number.isFinite(value)) throw new Error('Result is not a real number');
        if (Object.is(value, -0)) value = 0;
        const rounded = Number(value.toPrecision(12));
        return new Intl.NumberFormat('en-US', { maximumSignificantDigits: 12 }).format(rounded);
      }

      function rawFormat(value) {
        if (!Number.isFinite(value)) throw new Error('No valid result to store');
        return Number(value.toPrecision(12)).toString();
      }

      function tokenize(source) {
        const tokens = [];
        let index = 0;
        while (index < source.length) {
          const rest = source.slice(index);
          if (/^\s/.test(rest)) { index++; continue; }
          const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);
          if (number) { tokens.push({ type: 'number', value: Number(number[0]) }); index += number[0].length; continue; }
          const identifier = rest.match(/^[a-zA-Z]+/);
          if (identifier) { tokens.push({ type: 'name', value: identifier[0].toLowerCase() }); index += identifier[0].length; continue; }
          const char = source[index++];
          if ('+-*/^()%!'.includes(char)) tokens.push({ type: char, value: char });
          else if (char === '÷') tokens.push({ type: '/', value: '/' });
          else if (char === '×') tokens.push({ type: '*', value: '*' });
          else if (char === 'π') tokens.push({ type: 'name', value: 'pi' });
          else throw new Error('Check the expression');
        }
        return tokens;
      }

      function evaluate(source) {
        const tokens = tokenize(source);
        let position = 0;
        const peek = () => tokens[position];
        const take = () => tokens[position++];
        const expect = (type) => { if (!peek() || peek().type !== type) throw new Error('Check the brackets and operators'); return take(); };
        const angle = (value) => degrees ? value * Math.PI / 180 : value;
        const fromAngle = (value) => degrees ? value * 180 / Math.PI : value;

        function primary() {
          const token = take();
          if (!token) throw new Error('Enter a calculation');
          if (token.type === 'number') return token.value;
          if (token.type === '(') { const value = addSub(); expect(')'); return value; }
          if (token.type === 'name') {
            const constants = { pi: Math.PI, e: Math.E, ans: answer };
            if (Object.hasOwn(constants, token.value)) return constants[token.value];
            if (!['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sqrt', 'log', 'ln', 'abs'].includes(token.value)) throw new Error('Unknown function');
            expect('(');
            const value = addSub();
            expect(')');
            const functions = {
              sin: (x) => Math.sin(angle(x)), cos: (x) => Math.cos(angle(x)), tan: (x) => Math.tan(angle(x)),
              asin: (x) => fromAngle(Math.asin(x)), acos: (x) => fromAngle(Math.acos(x)), atan: (x) => fromAngle(Math.atan(x)),
              sqrt: (x) => Math.sqrt(x), log: (x) => Math.log10(x), ln: (x) => Math.log(x), abs: (x) => Math.abs(x)
            };
            return functions[token.value](value);
          }
          throw new Error('Check the expression');
        }

        function postfix() {
          let value = primary();
          while (peek() && (peek().type === '!' || peek().type === '%')) {
            const op = take().type;
            if (op === '%') value /= 100;
            else {
              if (value < 0 || value > 170 || !Number.isInteger(value)) throw new Error('Factorial needs a whole number from 0 to 170');
              let product = 1;
              for (let n = 2; n <= value; n++) product *= n;
              value = product;
            }
          }
          return value;
        }

        function power() {
          const value = postfix();
          if (peek() && peek().type === '^') { take(); return Math.pow(value, unary()); }
          return value;
        }
        function unary() {
          if (peek() && (peek().type === '+' || peek().type === '-')) return take().type === '-' ? -unary() : unary();
          return power();
        }
        function mulDiv() {
          let value = unary();
          while (peek() && (peek().type === '*' || peek().type === '/')) {
            const op = take().type;
            const right = unary();
            value = op === '*' ? value * right : value / right;
          }
          return value;
        }
        function addSub() {
          let value = mulDiv();
          while (peek() && (peek().type === '+' || peek().type === '-')) {
            const op = take().type;
            const right = mulDiv();
            value = op === '+' ? value + right : value - right;
          }
          return value;
        }

        const value = addSub();
        if (position !== tokens.length) throw new Error('Check the expression');
        if (!Number.isFinite(value)) throw new Error('Result is not a real number');
        return value;
      }

      function render() {
        expressionView.textContent = expression || 'Ready when you are';
        resultView.classList.remove('error');
        if (!expression) { resultView.textContent = '0'; return; }
        try { resultView.textContent = format(evaluate(expression)); }
        catch (error) {
          if (/Enter a calculation/.test(error.message)) { resultView.textContent = '0'; return; }
          resultView.textContent = error.message;
          resultView.classList.add('error');
        }
      }

      function persistHistory() {
        try { localStorage.setItem(historyKey, JSON.stringify(history.slice(0, 30))); } catch { /* Storage may be unavailable in private browsing. */ }
        renderHistory();
      }

      function renderHistory() {
        historyView.replaceChildren();
        if (!history.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-history';
          empty.textContent = 'Your recent calculations will appear here.';
          historyView.append(empty);
          return;
        }
        history.forEach((item) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'history-item';
          button.title = 'Use this result again';
          const formula = document.createElement('span');
          formula.className = 'history-expression';
          formula.textContent = item.expression + ' =';
          const value = document.createElement('span');
          value.className = 'history-result';
          value.textContent = item.result;
          button.append(formula, value);
          button.addEventListener('click', () => {
            expression = item.raw;
            justCalculated = false;
            render();
          });
          historyView.append(button);
        });
      }

      function calculate() {
        try {
          const value = evaluate(expression);
          const raw = rawFormat(value);
          const item = { expression, result: format(value), raw };
          answer = value;
          history = [item, ...history.filter((entry) => entry.expression !== item.expression)].slice(0, 30);
          persistHistory();
          expression = raw;
          justCalculated = true;
          render();
        } catch (error) {
          resultView.textContent = error.message;
          resultView.classList.add('error');
        }
      }

      function insert(value) {
        if (justCalculated && /^[0-9.]$/.test(value)) expression = '';
        justCalculated = false;
        if (value === 'Ans') value = 'Ans';
        expression += value;
        render();
      }

      function deleteLast() {
        expression = expression.slice(0, -1);
        justCalculated = false;
        render();
      }

      document.getElementById('keypad').addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.insert !== undefined) { insert(button.dataset.insert); return; }
        switch (button.dataset.action) {
          case 'clear': expression = ''; justCalculated = false; render(); break;
          case 'delete': deleteLast(); break;
          case 'equals': calculate(); break;
          case 'sign': expression = expression ? '-(' + expression + ')' : '-'; justCalculated = false; render(); break;
        }
      });

      document.querySelector('.memory-row').addEventListener('click', (event) => {
        const action = event.target.dataset.action;
        if (!action) return;
        if (action === 'mc') memory = null;
        if (action === 'mr' && memory !== null) insert(rawFormat(memory));
        if (action === 'mplus' || action === 'mminus') {
          try {
            const current = expression ? evaluate(expression) : answer;
            memory = (memory || 0) + (action === 'mplus' ? current : -current);
          } catch { resultView.textContent = 'Enter a valid calculation first'; resultView.classList.add('error'); }
        }
        memoryIndicator.classList.toggle('active', memory !== null);
        memoryIndicator.setAttribute('aria-label', memory === null ? 'Memory empty' : 'Memory contains a value');
      });

      angleToggle.addEventListener('click', () => {
        degrees = !degrees;
        angleToggle.textContent = degrees ? 'DEG' : 'RAD';
        angleToggle.setAttribute('aria-label', degrees ? 'Degrees selected. Switch to radians' : 'Radians selected. Switch to degrees');
        render();
      });

      document.getElementById('clearHistory').addEventListener('click', () => {
        history = [];
        persistHistory();
      });

      document.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.altKey || event.metaKey) return;
        if (/^[0-9.]$/.test(event.key) || /^[()+\-*/%^!]$/.test(event.key)) { event.preventDefault(); insert(event.key); }
        else if (event.key.toLowerCase() === 'x') { event.preventDefault(); insert('×'); }
        else if (event.key.toLowerCase() === 'p') { event.preventDefault(); insert('π'); }
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); calculate(); }
        else if (event.key === 'Backspace') { event.preventDefault(); deleteLast(); }
        else if (event.key === 'Escape') { expression = ''; justCalculated = false; render(); }
      });

      renderHistory();
      render();
    })();
  </script>
</body>
</html>
